name: Release

# Push a tag like v0.1.0 to publish a release built from exactly that commit.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm run package
      - name: Publish release with checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum rolens-*.zip > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" rolens-*.zip SHA256SUMS.txt --generate-notes
