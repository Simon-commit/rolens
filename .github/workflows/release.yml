name: Release

# Push a tag like v0.1.0, or publish a release with a new tag from GitHub's Releases page,
# to attach a build made from exactly that commit.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm run package
      - name: Publish release with checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum rolens-*.zip > SHA256SUMS.txt
          # A release published from GitHub's Releases page creates the tag itself; attach the build to it.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" rolens-*.zip SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" rolens-*.zip SHA256SUMS.txt --generate-notes
          fi
