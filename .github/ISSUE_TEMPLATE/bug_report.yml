name: Bug report
description: Something on Roblox looks wrong or broken with RoLens installed.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the Roblox page URL and a screenshot if you can.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: input
    id: version
    attributes:
      label: RoLens version
      description: Shown on the RoLens card at chrome://extensions
  - type: input
    id: browser
    attributes:
      label: Browser and version
